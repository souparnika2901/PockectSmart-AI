{% extends "base.html" %}{% block content %}<div class="page-head"><p class="eyebrow">SMART PLANNER</p><h1>Home Interior Planner</h1><p>Enter your budget and room needs.</p></div><div class="form-card"><form id="homeForm"><label>Total budget (INR)<input name="budget" type="number" min="1" required></label><label>Rooms<input name="rooms" placeholder="Living Room, Bedroom" required></label><label>Style<select name="style"><option>modern</option><option>minimal</option><option>traditional</option><option>budget</option></select></label><label>Notes<textarea name="notes" placeholder="e.g. need a dining table and warm lighting"></textarea></label><button class="btn">Generate Recommendations</button></form><div id="result"></div></div>{% endblock %}{% block scripts %}<script>setupPlanner("home");</script>{% endblock %}
