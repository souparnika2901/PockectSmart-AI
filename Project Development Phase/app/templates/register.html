{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>Create Account</h1>

   <form method="POST" action="/register">

        <label>Username</label>

        <input
            type="text"
            name="username"
            minlength="3"
            required
        >

        <label>Email</label>

        <input
            type="email"
            name="email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            minlength="6"
            required
        >

        <button type="submit" class="button">
            Register
        </button>

    </form>

    <p>
        Already registered?
        <a href="/login">Login</a>
    </p>

</div>

{% endblock %}
