{% extends "base.html" %}{% block content %}<div class="page-head"><p class="eyebrow">SMART PLANNER</p><h1>Party Budget Planner</h1><p>Plan a party around your budget and guest count.</p></div><div class="form-card"><form id="partyForm"><label>Total budget (INR)<input name="budget" type="number" min="1" required></label><label>Guests<input name="guests" type="number" min="1" required></label><label>Event type<select name="event_type"><option>birthday</option><option>wedding</option><option>corporate</option><option>family</option></select></label><label>Venue<select name="venue"><option>home</option><option>hall</option><option>hotel</option><option>outdoor</option></select></label><label>City<input name="city" placeholder="Kozhikode"></label><label>Notes<textarea name="notes"></textarea></label><button class="btn">Generate Recommendations</button></form><div id="result"></div></div>{% endblock %}{% block scripts %}<script>setupPlanner("party");</script>{% endblock %}
