{% extends "base.html" %}{% block content %}<div class="page-head"><p class="eyebrow">SMART PLANNER</p><h1>Jewelry Planner</h1><p>Choose an occasion and optionally upload an outfit image.</p></div><div class="form-card"><form id="jewelryForm"><label>Budget (INR)<input name="budget" type="number" min="1" required></label><label>Occasion<select name="occasion"><option>casual</option><option>wedding</option><option>party</option><option>office</option><option>festive</option></select></label><label>Outfit style<select name="outfit_style"><option>elegant</option><option>minimal</option><option>traditional</option><option>western</option><option>bold</option></select></label><label>Metal preference<select name="metal"><option>any</option><option>gold-tone</option><option>silver-tone</option><option>rose-gold-tone</option></select></label><label>Outfit image (optional)<input name="outfit_image" type="file" accept="image/png,image/jpeg,image/webp"></label><label>Notes<textarea name="notes" placeholder="Colours or jewelry type you prefer"></textarea></label><button class="btn">Generate Recommendations</button></form><div id="result"></div></div>{% endblock %}{% block scripts %}<script>setupPlanner("jewelry");</script>{% endblock %}
